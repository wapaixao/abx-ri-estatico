<body class="locked">
  <div class="auth-screen" id="authScreen"><div class="auth-card"><h2>Acesso restrito</h2><p>Digite a senha para visualizar o dashboard.</p><input id="passwordInput" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter') unlock()"><button type="button" onclick="unlock()">Entrar</button><div class="error" id="passwordError"></div><p style="font-size:12px;margin-top:14px">Senha: ABX2026</p></div></div>
  <header class="hero"><h1>ABX / Água Branca — Dashboard RI Estático</h1><p>BP, DRU, Receita Gerencial U006, PIS/COFINS e Distribuição de Resultado. Layouts preservam os modelos atuais.</p></header>
  <main class="wrap">
    <section class="panel toolbar">
      <div class="field"><label>Relatório</label><div class="report-buttons"><button id="btn-BP" type="button" onclick="setReport('BP')">BP</button><button class="disabled" type="button" title="DRE será tratado depois">DRE</button><button id="btn-DRU" type="button" onclick="setReport('DRU')">DRU</button><button id="btn-U006" type="button" onclick="setReport('U006')">Campo<br>Grande</button><button id="btn-PISCOFINS" type="button" onclick="setReport('PISCOFINS')">PIS/<br>COFINS</button><button id="btn-RESUMO" type="button" onclick="setReport('RESUMO')">Resumo</button><button id="btn-DISTRIB" type="button" onclick="setReport('DISTRIB')">Lucros</button><button id="btn-ORG" type="button" onclick="setReport('ORG')">Organo<br>grama</button></div></div>
      <div class="field matrix-only"><label>Períodos</label><div class="periods" id="periodSelectors"></div></div>

<script>
let DATA=null, reportType='BP', viewMode='sideTotal', selected=new Set(), selectedPeriods=new Set();
const fmt=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const LOGOS={};
function norm(s){return String(s||'').trim().replace(/[–—]/g,'-').toUpperCase()}
function unlock(){const input=document.getElementById('passwordInput'),err=document.getElementById('passwordError');if(['ABX2026','ABX-96VSFQGT5J_M'].includes(norm(input.value))){try{sessionStorage.setItem('abx_ri_auth','ok')}catch(e){}document.body.classList.remove('locked');document.getElementById('authScreen').style.display='none';input.value='';render()}else{err.textContent='Senha inválida. Use ABX2026';input.select()}}
function initAuth(){try{if(sessionStorage.getItem('abx_ri_auth')==='ok'){document.body.classList.remove('locked');document.getElementById('authScreen').style.display='none'}}catch(e){}}
const PARTICIP={
 '001':[['ABX',60],['M&M',10],['Odair Leonardi',15],['Felipe Castilho',15]],'002':[['ABX',80],['M&M',10],['Lucas Colombo',10]],'003':[['ABX',90],['M&M',10]],'004':[['ABX',90],['M&M',10]],'005':[['ABX',60],['M&M',10],['Rodrigo Cordeiro',30]],'006':[['ABX',90],['M&M',10]],'007':[['ABX',60],['M&M',10],['Rogerio Moraes',30]],'008':[['ABX',60],['M&M',10],['Cleber Stremo',30]],'009':[['ABX',60],['M&M',10],['Odair Leonardi',10],['Felipe Castilho',10],['Lucas Colombo',10]],'010':[['ABX',60],['M&M',10],['Agenor',30]],'011':[['ABX',60],['M&M',10],['Odair Leonardi',15],['Felipe Castilho',15]],'050':[['ABX',60],['M&M',10],['Ivan',30]],'100':[['ABX',60],['M&M',10],['Marcio Leiva',30]],'101':[['ABX',90],['M&M',10]],'103':[['ABX',70],['M&M',10],['Lucas Colombo',10],['Isaías / CJ Prime',10]]
};
function isOrg(){return reportType==='ORG'}function rep(){return DATA.reports[reportType]}function isSheet(){return !isOrg()&&rep().type==='sheet'}function isControl(){return !isOrg()&&rep().type==='unit_period_control'}function isDistribSheet(){return reportType==='DISTRIB'&&isSheet()}
function distribUnits(){if(!isDistribSheet())return[];return rep().rows[0].map((c,i)=>({idx:i,name:c.v,code:(String(c.v||'').match(/(\d{3})/)||[])[1]||String(c.v||'').slice(0,3)})).filter(u=>u.name)}function distribPeriods(){return['2024','2025','1º TRIM 2026','2º TRIM 2026']}
function selectableCompanies(){return isOrg()?[]:(isDistribSheet()?distribUnits():(isSheet()?[]:rep().companies.filter(c=>!String(c.name).startsWith('TOTAL'))))}function effectiveCompanies(){const base=selectableCompanies();const arr=base.filter(c=>selected.has(c.name));return arr.length?arr:base}function activePeriods(){const periods=isDistribSheet()?distribPeriods():(isOrg()?[]:rep().periods);const arr=periods.filter(p=>selectedPeriods.has(p));return arr.length?arr:periods}
function money(v){if(!v)return '<span class="zero">–</span>';return fmt.format(v)}function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function rowTotal(row,p){return effectiveCompanies().reduce((s,c)=>s+(row.empresas[c.name]?.[p]||0),0)}
function initSelection(){if(isOrg()||(isSheet()&&!isDistribSheet())){selected=new Set();selectedPeriods=new Set();return}selected=new Set(selectableCompanies().map(c=>c.name));selectedPeriods=new Set(isDistribSheet()?distribPeriods():rep().periods)}
function setReport(r){reportType=r;initSelection();renderSelectors();render()}function togglePeriodIndex(i){const periods=isDistribSheet()?distribPeriods():rep().periods;const p=periods[i];if(selectedPeriods.has(p)&&selectedPeriods.size>1)selectedPeriods.delete(p);else selectedPeriods.add(p);renderSelectors();render()}function toggleCompanyIndex(i){const c=selectableCompanies()[i];if(!c)return;if(selected.has(c.name)&&selected.size>1)selected.delete(c.name);else selected.add(c.name);renderSelectors();render()}function setAll(on){const base=selectableCompanies();selected=on?new Set(base.map(c=>c.name)):new Set([base[0]?.name].filter(Boolean));renderSelectors();render()}function setViewMode(v){viewMode=v;render()}function displayHeader(c){return reportType==='DRU'?String(c.name).replace(/^\d+\s*-\s*/,''):c.name}
function renderSelectors(){['BP','DRU','U006','PISCOFINS','RESUMO','DISTRIB','ORG'].forEach(k=>{const b=document.getElementById('btn-'+k);if(b)b.classList.toggle('active',reportType===k)});document.querySelector('.toolbar').classList.toggle('distrib-toolbar',isDistribSheet());document.querySelectorAll('.matrix-only').forEach(el=>el.classList.toggle('hidden',isOrg()||(isSheet()&&!isDistribSheet())));if(isOrg()||(isSheet()&&!isDistribSheet()))return;document.getElementById('modeSelect').value=viewMode;document.getElementById('selectorTitle').textContent=reportType==='BP'?'Empresas':(reportType==='PISCOFINS'?'Unidades PIS/COFINS':(isDistribSheet()?'Unidades Lucros':'Unidades DRU'));const allBtn=document.getElementById('allBtn');if(allBtn)allBtn.textContent=reportType==='BP'?'ABX':'Todas';const periods=isDistribSheet()?distribPeriods():rep().periods;document.getElementById('periodSelectors').innerHTML=periods.map((p,i)=>'<button type="button" class="chip '+(selectedPeriods.has(p)?'selected':'')+'" onclick="togglePeriodIndex('+i+')">'+esc(String(p).replace(' TRIM 2026',' Trim'))+'</button>').join('');document.getElementById('companySelectors').innerHTML=selectableCompanies().map((c,i)=>{if(reportType==='BP'){const img=c.logo_asset?'<img src="'+esc(c.logo_asset)+'" alt="'+esc(c.name)+'">':esc(c.code||c.name);const badge=c.badge?'<span class="badge">'+esc(c.badge)+'</span>':'';return '<button type="button" class="logo-chip '+(c.logo_asset?'':'fallback')+' '+(selected.has(c.name)?'selected':'')+'" title="'+esc(c.name)+'" onclick="toggleCompanyIndex('+i+')">'+img+badge+'</button>'}const label=c.code||c.name.split(' - ')[0];return '<button type="button" class="chip dru-chip '+(selected.has(c.name)?'selected':'')+'" title="'+esc(c.name)+'" onclick="toggleCompanyIndex('+i+')">'+esc(label)+'</button>'}).join('')}
function findRow(label){return rep().rows.find(r=>String(r.descricao).toUpperCase()===label)}function total(label,p){const row=findRow(label);return row?rowTotal(row,p):0}function pct(v,p){const rl=total('RECEITA LIQUIDA',p);return rl?((v/rl)*100).toFixed(1).replace('.',',')+'%':'–'}
function renderCards(){if(isOrg()||isSheet()||isControl()){document.getElementById('cards').innerHTML='';return}const p=activePeriods()[activePeriods().length-1];let cards=[];if(reportType==='BP'){cards=[['ATIVO',total('ATIVO',p)],['PASSIVO TOTAL',total('PASSIVO TOTAL',p)],['PATRIMÔNIO LÍQUIDO',total('PATRIMÔNIO LÍQUIDO',p)],['Disponibilidade',total('DISPONIBILIDADE',p)]]}else{const cmv=total('CMV',p),desp=total('DESPESA OPERACIONAIS',p),ebitda=total('EBITDA',p),lucro=total('LUCRO LIQUIDO',p);cards=[['RECEITA LÍQUIDA',total('RECEITA LIQUIDA',p),null],['CMV',cmv,pct(cmv,p)],['DESP. OPERACIONAL',desp,pct(desp,p)],['EBITDA',ebitda,pct(ebitda,p)],['LUCRO LÍQUIDO',lucro,pct(lucro,p)]]}document.getElementById('cards').innerHTML=cards.map(c=>'<article class="card"><small>'+esc(c[0])+' em '+esc(p)+'</small><strong class="'+(c[1]<0?'neg':'')+'">'+money(c[1])+(c[2]?' <span class="pct">'+esc(c[2])+'</span>':'')+'</strong></article>').join('')}
function cell(v,extra,total){return '<td class="num '+(extra||'')+' '+(total?'total-col':'')+' '+(v<0?'neg':'')+'">'+money(v)+'</td>'}function shouldShowRow(r){if(viewMode!=='summary')return true;const nivel=Number(r.nivel),d=String(r.descricao||'').toUpperCase();if(reportType==='BP')return nivel<=2||['DISPONIBILIDADE','ESTOQUES','CRÉDITOS A RECEBER','RECEBÍVEIS ANTECIPADOS','ADIANTAMENTOS','FORNECEDORES','ALUGUÉIS','SALÁRIOS E CONTRIBUIÇÕES','IMPOSTOS A PAGAR','EMPRÉSTIMOS E FINANCIAMENTOS','CRÉDITOS ROTATIVOS','CAPITAL SOCIAL','RETIRADAS / PARTICIPAÇÕES','RESULTADOS ACUMULADOS'].includes(d);return nivel<=2||['RECEITA LIQUIDA','CMV','DESPESA OPERACIONAIS','EBITDA','LUCRO LIQUIDO','LUCRO LÍQUIDO GERENCIAL','LAIR GERENCIAL','NOVO LUCRO LÍQUIDO'].includes(d)}
function renderMatrix(){const comps=effectiveCompanies(),ps=activePeriods(),rows=rep().rows.filter(shouldShowRow),synthetic=viewMode==='summary',tableMode=synthetic?'sideTotal':viewMode;let out='<section class="panel table-panel report-'+reportType+'"><div class="table-head"><h2>'+esc(rep().label)+' — '+(synthetic?'visualização sintética':(tableMode==='total'?'Total':(ps.length>1?'períodos por bloco':'período por bloco')))+'</h2><span class="pill">'+comps.length+' selecionada(s)'+(synthetic?' · sintético':'')+'</span></div><div class="table-wrap"><table>';if(tableMode==='total'){out+='<thead><tr><th class="desc">Descrição</th>'+ps.map((p,i)=>'<th class="period-head '+(i===0?'sep-left':'')+'">'+esc(p)+'</th>').join('')+'</tr></thead><tbody>';rows.forEach(r=>{out+='<tr class="lvl'+Math.floor(Number(r.nivel))+'"><td class="desc" title="'+esc(r.descricao)+'">'+esc(r.descricao)+'</td>'+ps.map((p,i)=>cell(rowTotal(r,p),i===0?'sep-left':'',true)).join('')+'</tr>'})}else{out+='<thead><tr><th class="desc" rowspan="2">Descrição</th>'+comps.map((c,i)=>'<th class="company-head '+(i===0?'sep-left':'')+'" colspan="'+ps.length+'">'+esc(displayHeader(c))+'</th>').join('')+(tableMode==='sideTotal'?'<th class="company-head sep-left" colspan="'+ps.length+'">TOTAL</th>':'')+'</tr><tr>'+comps.map(c=>ps.map((p,i)=>'<th class="period-head '+(i===0?'sep-left':'')+'">'+esc(p)+'</th>').join('')).join('')+(tableMode==='sideTotal'?ps.map(p=>'<th class="period-head sep-left">'+esc(p)+'</th>').join(''):'')+'</tr></thead><tbody>';rows.forEach(r=>{out+='<tr class="lvl'+Math.floor(Number(r.nivel))+'"><td class="desc" title="'+esc(r.descricao)+'">'+esc(r.descricao)+'</td>'+comps.map(c=>ps.map((p,i)=>cell(r.empresas[c.name]?.[p]||0,i===0?'sep-left':'',false)).join('')).join('')+(tableMode==='sideTotal'?ps.map(p=>cell(rowTotal(r,p),'sep-left',true)).join(''):'')+'</tr>'})}out+='</tbody></table></div></section>';document.getElementById('tables').innerHTML=out}
function fmtCell(v){if(typeof v==='number')return fmt.format(v);return esc(v)}function fmtNum(v){return typeof v==='number'?fmt.format(v):esc(v??'')}
function distribBlock(p){return {'2024':{summary:2,partners:[6,10]},'2025':{summary:12,partners:[16,20]},'1º TRIM 2026':{summary:29,partners:[33,37]},'2º TRIM 2026':{summary:39,partners:[43,46]}}[p]}
function renderDistribCompact(){const units=effectiveCompanies(),periods=activePeriods();let out='<section class="panel table-panel report-DISTRIB"><div class="table-head"><h2>Lucros — visão compacta por unidade e período</h2><span class="pill">'+units.length+' unidade(s) · '+periods.length+' período(s)</span></div><p class="sheet-note">Percentuais dos sócios em coluna separada. Nomes e participações seguem a regra gerencial validada: ABX / M&M / demais participantes por unidade.</p><div class="table-wrap"><div class="lucros-grid">';periods.forEach(p=>{const b=distribBlock(p);if(!b)return;units.forEach((u)=>{const pos=distribUnits().findIndex(x=>x.name===u.name), s=1+3*pos, v=s+1, code=u.code, parts=PARTICIP[code]||[], result=rep().rows[b.summary]?.[v]?.v||0, neg=rep().rows[b.summary+1]?.[v]?.v||0, liquid=rep().rows[b.summary+2]?.[v]?.v||0, base=Math.max(liquid,0);out+='<article class="lucro-card"><div class="lucro-title">'+esc(u.name)+'</div><div class="lucro-period">'+esc(p)+'</div><table class="lucro-table"><tbody>';[['Resultado',result],['Negativo Anterior',neg],['Resultado Líquido',liquid]].forEach(x=>{out+='<tr><td>'+x[0]+'</td><td></td><td class="num '+(x[1]<0?'neg':'')+'">'+fmtNum(x[1])+'</td></tr>'});out+='<tr class="sep-row"><td colspan="3">Distribuição por parceiro</td></tr><tr><th class="partner-col">Parceiro</th><th class="pct-col">%</th><th class="value-col">Valor</th></tr>';parts.forEach(([nome,pctv])=>{const valor=base*pctv/100;out+='<tr><td>'+esc(nome)+'</td><td class="pct-col">'+esc(pctv)+'%</td><td class="num value-col '+(valor<0?'neg':'')+'">'+fmtNum(valor)+'</td></tr>'});out+='</tbody></table></article>'})});out+='</div></div></section>';document.getElementById('tables').innerHTML=out}
function renderSheet(){let out='<section class="panel table-panel report-'+reportType+'"><div class="table-head"><h2>'+esc(rep().label)+'</h2><span class="pill">layout Excel preservado</span></div><p class="sheet-note">Modelo operacional mantido para preservar formato, cores e totalizadores atuais.</p><div class="table-wrap"><table class="sheet-table"><tbody>';rep().rows.forEach(row=>{out+='<tr>'+row.map(cell=>{let style='';if(cell.style?.bg)style+='background:'+cell.style.bg+';';if(cell.style?.color)style+='color:'+cell.style.color+';';if(cell.style?.bold)style+='font-weight:900;';const cls=(typeof cell.v==='number')?'num':'';return '<td class="'+cls+'" colspan="'+(cell.cs||1)+'" rowspan="'+(cell.rs||1)+'" style="'+style+'">'+fmtCell(cell.v)+'</td>'}).join('')+'</tr>'});out+='</tbody></table></div></section>';document.getElementById('tables').innerHTML=out}
function orgUnits(){const rows=DATA.reports.DISTRIB.rows;return rows[0].map((c,i)=>({idx:i,name:c.v,code:(String(c.v||'').match(/(\d{3})/)||[])[1]||String(c.v||'').slice(0,3)})).filter(u=>u.name)}function renderOrg(){const units=orgUnits();let unitHtml=units.map(u=>'<div class="org-unit"><b>'+esc(u.name)+'</b><span>'+(PARTICIP[u.code]||[]).map(x=>esc(x[0])+' '+x[1]+'%').join(' · ')+'</span></div>').join('');document.getElementById('tables').innerHTML='<section class="panel table-panel org-panel"><div class="org-hero"><h2>Organograma societário e gerencial — ABX / Água Branca</h2><p>Leitura executiva baseada nos organogramas enviados agora e nas participações gerenciais das unidades.</p></div><div class="org-images"><div class="org-image-card"><h3>Organograma Água Branca — filiais</h3><img src="assets/org/doc_00743f9ef1f8_Organograma_Agua_Branca_filiais_p1.png" alt="Organograma Água Branca filiais"></div><div class="org-image-card"><h3>Organograma Água Branca — geral</h3><img src="assets/org/doc_270dbd2b9672_Organograma_Agua_Branca_p1.png" alt="Organograma Água Branca geral"></div></div><div class="org-grid"><div class="org-card"><h3>Topo societário</h3><div class="org-node"><span class="org-badge">65%</span><b>RRX</b><small>Empresa 100% de Renato Cordeiro Randolpho</small></div><div class="org-node"><span class="org-badge">35%</span><b>3B+ Holdings</b><small>Veículo de Alessandro Becchi e Joanna Barreto</small></div><div class="org-node"><b>ABX Participações S.A.</b><small>Controladora do grupo operacional</small></div></div><div class="org-card"><h3>Água Branca LTDA — formal</h3><div class="org-node"><span class="org-badge">90%</span><b>ABX Participações S.A.</b><small>Sócia formal majoritária</small></div><div class="org-node"><span class="org-badge">10%</span><b>M&M</b><small>Maiolo & Menegatti Investimentos LTDA; usar M&M como nome de participação</small></div></div><div class="org-card"><h3>Blocos gerenciais</h3><div class="org-node"><b>Filiais 001 a 011</b><small>Unidades operacionais Água Branca; participantes são econômicos/gerenciais, não sócios formais do CNPJ.</small></div><div class="org-node"><b>Negócios/marcas 050, 100, 101 e 103</b><small>HortiVan, Top Frutas/Top Morena, Água Branca e Top Verde.</small></div></div></div><h3 style="color:var(--blue2);margin:14px 0 8px">Participações gerenciais por unidade</h3><div class="org-units">'+unitHtml+'</div></section>'}
function render(){if(!DATA)return;renderCards();isOrg()?renderOrg():(isDistribSheet()?renderDistribCompact():(isSheet()?renderSheet():renderMatrix()))}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;initSelection();renderSelectors();render();initAuth()}).catch(e=>{document.getElementById('tables').innerHTML='<section class="panel table-panel">Erro ao carregar data.json: '+esc(e.message)+'</section>';initAuth()});
</script>
