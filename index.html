<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABX | RI Estático</title>
  <link rel="stylesheet" href="styles/app.css?v=clean1">
</head>
<body class="locked">
  <div class="auth-screen" id="authScreen"><div class="auth-card"><h2>Acesso restrito</h2><p>Digite a senha para visualizar o dashboard.</p><input id="passwordInput" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter') unlock()"><button type="button" onclick="unlock()">Entrar</button><div class="error" id="passwordError"></div><p style="font-size:12px;margin-top:14px">Senha: ABX2026</p></div></div>
  <header class="hero"><h1>ABX / Água Branca — Dashboard RI Estático</h1><p>BP, DRU, Receita Gerencial U006, PIS/COFINS e Distribuição de Resultado. Layouts preservam os modelos atuais.</p></header>
  <main class="wrap">
    <section class="panel toolbar">
      <div class="field"><label>Relatório</label><div class="report-buttons"><button id="btn-BP" type="button" onclick="setReport('BP')">BP</button><button id="btn-DRE" class="disabled" type="button" title="DRE será tratado depois; relatórios ainda não enviados" onclick="return false">DRE</button><button id="btn-DRU" type="button" onclick="setReport('DRU')">DRU</button><button id="btn-U006" type="button" onclick="setReport('U006')">Campo<br>Grande</button><button id="btn-PISCOFINS" type="button" onclick="setReport('PISCOFINS')">PIS/<br>COFINS</button><button id="btn-RESUMO" type="button" onclick="setReport('RESUMO')">Resumo</button><button id="btn-DISTRIB" type="button" onclick="setReport('DISTRIB')">Lucros</button><button id="btn-ORG" type="button" onclick="setReport('ORG')">Organo<br>grama</button></div></div>
      <div class="field matrix-only"><label>Períodos</label><div class="periods" id="periodSelectors"></div></div>
      <div class="field matrix-only view-field"><label>Visualização</label><select id="modeSelect" onchange="setViewMode(this.value)"><option value="sideTotal">+ Total</option><option value="side">Só blocos</option><option value="total">Só total</option><option value="summary">Sintético</option></select></div>
      <div class="field company-field matrix-only"><span class="selector-title" id="selectorTitle">Empresas</span><div class="companies" id="companySelectors"></div></div>
      <div class="field summary-only matrix-only hidden"><label>Visão</label><div class="summary-view-buttons"><button id="summaryAllBtn" type="button" onclick="setSummaryMetric('all')">Tudo</button><button id="summaryPisBtn" type="button" onclick="setSummaryMetric('piscofins')">PIS</button><button id="summaryLucrosBtn" type="button" onclick="setSummaryMetric('lucros')">Lucros</button><button id="summaryPartBtn" type="button" onclick="toggleSummaryParticipations()">Particip.</button></div></div>
      <div class="actions matrix-only"><button id="allBtn" type="button" onclick="setAll(true)">ABX</button><button type="button" onclick="setAll(false)">Limpar</button></div>
    </section>
    <section class="cards" id="cards"></section>
    <div id="tables"><section class="panel table-panel">Carregando...</section></div>
  </main>
<script src="src/state.js?v=clean2" defer></script>
<script src="src/utils.js?v=clean2" defer></script>
<script src="src/auth.js?v=clean2" defer></script>
<script src="src/participacoes.js?v=clean2" defer></script>
<script src="src/report-helpers.js?v=clean2" defer></script>
<script src="src/selection.js?v=clean2" defer></script>
<script src="src/selectors.js?v=clean2" defer></script>
<script src="src/cards.js?v=clean2" defer></script>
<script src="src/matrix.js?v=clean2" defer></script>
<script src="src/lucros.js?v=clean2" defer></script>
<script src="src/resumo.js?v=clean2" defer></script>
<script src="src/sheet.js?v=clean2" defer></script>
<script src="src/organograma.js?v=clean2" defer></script>
<script src="src/boot.js?v=clean2" defer></script>
</body>
</html>
