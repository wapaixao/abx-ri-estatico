function resumoValue(row,p,field){const base=p==='1T26'?1:6;const map={piscofins:0,lucro:1,distribuir:2,prejuizo:3};return Number(row[base+map[field]]?.v||0)}function resumoRows(){return effectiveCompanies().map(u=>({unit:u,row:rep().rows[u.idx]})).filter(x=>x.row)}function resumoRowsAll(){const rr=DATA?.reports?.RESUMO;return resumoUnits().map(u=>({unit:u,row:rr?.rows[u.idx]})).filter(x=>x.row)}function resumoRowByCode(code){return resumoRowsAll().find(x=>x.unit.code===code)?.row}function resumoTotals(rows,p){return rows.reduce((a,x)=>{a.piscofins+=resumoValue(x.row,p,'piscofins');a.lucro+=resumoValue(x.row,p,'lucro');a.distribuir+=resumoValue(x.row,p,'distribuir');a.prejuizo+=resumoValue(x.row,p,'prejuizo');return a},{piscofins:0,lucro:0,distribuir:0,prejuizo:0})}function resumoFields(){return summaryMetric==='piscofins'?[['piscofins','PIS/COFINS']]:(summaryMetric==='lucros'?[['lucro','Lucro Líquido DRU'],['distribuir','Lucros a Distribuir'],['prejuizo','Prejuízo a Compensar']]:[['piscofins','PIS/COFINS'],['lucro','Lucro Líquido DRU'],['distribuir','Lucros a Distribuir'],['prejuizo','Prejuízo a Compensar']])}function resumoMetricLabel(){return summaryMetric==='piscofins'?'Só PIS/COFINS':(summaryMetric==='lucros'?'Só Lucros':'PIS/COFINS e Lucros')}function resumoDistribFor(code,p){const row=resumoRowByCode(code);if(!row)return null;const result=resumoValue(row,p,'piscofins')+resumoValue(row,p,'lucro'), liquid=resumoValue(row,p,'distribuir'), neg=liquid-result;return{result,neg,liquid,base:Math.max(liquid,0)}}function renderResumoUnidades(){const units=resumoRows(),periods=activePeriods(),fields=resumoFields();let out='<section class="panel table-panel report-RESUMO"><div class="table-head"><h2>Resumo — '+esc(resumoMetricLabel())+'</h2><span class="pill">'+units.length+' unidade(s) · '+periods.length+' trimestre(s)</span></div><p class="resumo-note">Visão padrão preservada: resultado por unidade, com prejuízo compensado conforme a regra atual da própria base.</p><div class="table-wrap"><table class="sheet-table resumo-table"><thead><tr><th class="unit-col" rowspan="2">Unidade</th>'+periods.map(p=>'<th class="period-main" colspan="'+fields.length+'">'+esc(resumoPeriodLabel(p))+'</th>').join('')+'</tr><tr>'+periods.map(p=>fields.map(f=>'<th class="subhead">'+esc(f[1])+'</th>').join('')).join('')+'</tr></thead><tbody>';units.forEach(x=>{out+='<tr><td class="unit-col">'+esc(x.unit.name)+'</td>'+periods.map(p=>fields.map(f=>{const v=resumoValue(x.row,p,f[0]);return '<td class="num '+(v<0?'neg':'')+'">'+fmtNum(v)+'</td>'}).join('')).join('')+'</tr>'});out+='<tr class="total-row"><td class="unit-col">TOTAL SELECIONADO</td>'+periods.map(p=>{const t=resumoTotals(units,p);return fields.map(f=>'<td class="num '+(t[f[0]]<0?'neg':'')+'">'+fmtNum(t[f[0]])+'</td>').join('')}).join('')+'</tr></tbody></table></div></section>';document.getElementById('tables').innerHTML=out}function renderResumoParticipacoes(){const rows=resumoRows(),periods=activePeriods(),socios={};let detail='';periods.forEach(p=>{detail+='<h3>'+esc(resumoPeriodLabel(p))+'</h3><table class="sheet-table resumo-table"><thead><tr><th class="unit-col">Unidade</th><th class="subhead">Sócio</th><th class="subhead">%</th><th class="subhead">Base distribuível</th><th class="subhead">Valor a receber</th></tr></thead><tbody>';rows.forEach(x=>{const base=Math.max(resumoValue(x.row,p,'distribuir'),0),parts=PARTICIP[x.unit.code]||[];parts.forEach(([nome,pctv])=>{const valor=base*pctv/100;socios[nome]=socios[nome]||{};socios[nome][p]=(socios[nome][p]||0)+valor;detail+='<tr><td class="unit-col">'+esc(x.unit.name)+'</td><td>'+esc(nome)+'</td><td class="num">'+esc(pctv)+'%</td><td class="num">'+fmtNum(base)+'</td><td class="num">'+fmtNum(valor)+'</td></tr>'})});detail+='</tbody></table>'});let sociosList=Object.keys(socios).map(nome=>({nome,total:periods.reduce((s,p)=>s+(socios[nome][p]||0),0)}));sociosList.sort((a,b)=>summarySort==='az'?a.nome.localeCompare(b.nome,'pt-BR'):(summarySort==='1t'?(socios[b.nome]['1T26']||0)-(socios[a.nome]['1T26']||0):(summarySort==='2t'?(socios[b.nome]['2T26']||0)-(socios[a.nome]['2T26']||0):b.total-a.total)));let sortHtml='<div class="sort-controls"><button type="button" class="'+(summarySort==='total'?'active':'')+'" onclick="setSummarySort(\'total\')">Maior Total</button><button type="button" class="'+(summarySort==='az'?'active':'')+'" onclick="setSummarySort(\'az\')">A-Z</button><button type="button" class="'+(summarySort==='1t'?'active':'')+'" onclick="setSummarySort(\'1t\')">Maior 1T26</button><button type="button" class="'+(summarySort==='2t'?'active':'')+'" onclick="setSummarySort(\'2t\')">Maior 2T26</button></div>';let out='<section class="panel table-panel report-RESUMO"><div class="table-head"><h2>Resumo — Participações por sócio</h2><span class="pill">'+rows.length+' unidade(s) · '+periods.length+' trimestre(s)</span></div><p class="resumo-note">Usa os percentuais gerenciais validados por unidade e a base <b>Lucros a Distribuir</b>. Se a unidade tem prejuízo no trimestre, a base fica zerada e o prejuízo permanece para compensação futura, como na regra atual.</p>'+sortHtml+'<div class="table-wrap"><table class="sheet-table resumo-table"><thead><tr><th class="unit-col">Sócio</th>'+periods.map(p=>'<th class="period-main">'+esc(resumoPeriodShort(p))+'</th>').join('')+'<th class="period-main">Total</th></tr></thead><tbody>';sociosList.forEach(item=>{const nome=item.nome,totalp=periods.reduce((s,p)=>s+(socios[nome][p]||0),0);out+='<tr class="partner-row"><td class="unit-col">'+esc(nome)+'</td>'+periods.map(p=>'<td class="num">'+fmtNum(socios[nome][p]||0)+'</td>').join('')+'<td class="num">'+fmtNum(totalp)+'</td></tr>'});out+='</tbody></table><details class="particip-detail"><summary>Ver detalhe por unidade e sócio</summary>'+detail+'</details></div></section>';document.getElementById('tables').innerHTML=out}function renderResumo(){summaryParticipations?renderResumoParticipacoes():renderResumoUnidades()}
function shouldSkipSheetCell(cell){return reportType==='RESUMO'&&String(cell.v??'')===''&&String(cell.style?.bg||'').toUpperCase()==='#FFFFFF'}function renderSheet(){let out='<section class="panel table-panel report-'+reportType+'"><div class="table-head"><h2>'+esc(rep().label)+'</h2><span class="pill">layout Excel preservado</span></div><p class="sheet-note">Modelo operacional mantido para preservar formato, cores e totalizadores atuais.</p><div class="table-wrap"><table class="sheet-table"><tbody>';rep().rows.forEach(row=>{out+='<tr>'+row.filter(cell=>!shouldSkipSheetCell(cell)).map(cell=>{let style='';if(cell.style?.bg)style+='background:'+cell.style.bg+';';if(cell.style?.color)style+='color:'+cell.style.color+';';if(cell.style?.bold)style+='font-weight:900;';const cls=(typeof cell.v==='number')?'num':'';return '<td class="'+cls+'" colspan="'+(cell.cs||1)+'" rowspan="'+(cell.rs||1)+'" style="'+style+'">'+fmtCell(cell.v)+'</td>'}).join('')+'</tr>'});out+='</tbody></table></div></section>';document.getElementById('tables').innerHTML=out}
function orgUnits(){const rows=DATA.reports.DISTRIB.rows;return rows[0].map((c,i)=>({idx:i,name:c.v,code:(String(c.v||'').match(/(\d{3})/)||[])[1]||String(c.v||'').slice(0,3)})).filter(u=>u.name)}function renderOrg(){const units=orgUnits();let unitHtml=units.map(u=>'<div class="org-unit"><b>'+esc(u.name)+'</b><span>'+(PARTICIP[u.code]||[]).map(x=>esc(x[0])+' '+x[1]+'%').join(' · ')+'</span></div>').join('');document.getElementById('tables').innerHTML='<section class="panel table-panel org-panel"><div class="org-hero"><h2>Organograma societário e gerencial — ABX / Água Branca</h2><p>Leitura executiva baseada nos organogramas enviados agora e nas participações gerenciais das unidades.</p></div><div class="org-images"><div class="org-image-card"><h3>Organograma Água Branca</h3><img src="assets/org/doc_270dbd2b9672_Organograma_Agua_Branca_p1.png" alt="Organograma Água Branca"></div><div class="org-image-card"><h3>Organograma ABX</h3><img src="assets/org/doc_5b37dcc66b5c_Organograma_ABX_p1.png" alt="Organograma ABX"></div></div><div class="org-grid"><div class="org-card"><h3>Topo societário</h3><div class="org-node"><span class="org-badge">65%</span><b>RRX</b><small>Empresa 100% de Renato Cordeiro Randolpho</small></div><div class="org-node"><span class="org-badge">35%</span><b>3B+ Holdings</b><small>Veículo de Alessandro Becchi e Joanna Barreto</small></div><div class="org-node"><b>ABX Participações S.A.</b><small>Controladora do grupo operacional</small></div></div><div class="org-card"><h3>Água Branca LTDA — formal</h3><div class="org-node"><span class="org-badge">90%</span><b>ABX Participações S.A.</b><small>Sócia formal majoritária</small></div><div class="org-node"><span class="org-badge">10%</span><b>M&M</b><small>Maiolo & Menegatti Investimentos LTDA; usar M&M como nome de participação</small></div></div><div class="org-card"><h3>Blocos gerenciais</h3><div class="org-node"><b>Filiais 001 a 011</b><small>Unidades operacionais Água Branca; participantes são econômicos/gerenciais, não sócios formais do CNPJ.</small></div><div class="org-node"><b>Negócios/marcas 050, 100, 101 e 103</b><small>HortiVan, Top Frutas/Top Morena, Água Branca e Top Verde.</small></div></div></div><h3 style="color:var(--blue2);margin:14px 0 8px">Participações gerenciais por unidade</h3><div class="org-units">'+unitHtml+'</div></section>'}
function render(){if(!DATA)return;renderCards();isOrg()?renderOrg():(isResumo()?renderResumo():(isDistribSheet()?renderDistribCompact():(isSheet()?renderSheet():renderMatrix())))}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;initSelection();renderSelectors();render();initAuth()}).catch(e=>{document.getElementById('tables').innerHTML='<section class="panel table-panel">Erro ao carregar data.json: '+esc(e.message)+'</section>';initAuth()});
</script>
