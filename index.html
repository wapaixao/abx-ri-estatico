<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABX | RI Estático</title>
  <style>
    :root{--blue:#173f63;--blue2:#0f2d49;--ink:#17202a;--muted:#65727f;--line:#d8dee5;--green:#e6f0df;--green2:#d8ead1;--yellow:#fff3cf;--bg:#f6f8fb;--red:#b42318;--gold:#cfae63;--soft:#f8fafc}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .hero{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:13px 22px;border-bottom:4px solid var(--gold)}.hero h1{margin:0;font-size:21px}.hero p{margin:3px 0 0;color:#dce8f2;font-size:12px}.wrap{max-width:1840px;margin:0 auto;padding:10px 12px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(18,38,63,.05)}
    .toolbar{display:grid;grid-template-columns:430px 300px 132px minmax(360px,1fr) 92px;gap:8px;align-items:end;padding:9px;margin-bottom:9px;position:relative;z-index:10}.field label,.selector-title{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;color:var(--blue2);margin:0 0 3px}.report-buttons{display:grid;grid-template-columns:repeat(6,minmax(54px,1fr));gap:5px;align-items:center}
    button,.chip{height:31px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--blue);font-weight:900;cursor:pointer;transition:.12s}button.active,.chip.selected{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 2px rgba(22,63,99,.18)}button.disabled{opacity:.42;cursor:not-allowed;background:#f3f5f7;color:#8b95a1}.periods,.companies{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;overflow-y:visible;padding:2px 4px 2px 0;min-height:36px}.chip{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0 8px;min-width:74px;font-size:10.5px;white-space:nowrap}.dru-chip{min-width:35px;width:35px;padding:0;font-size:10px}.chip.selected:after{content:'✓';position:absolute;right:-5px;top:-7px;width:15px;height:15px;border-radius:999px;background:var(--blue);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;box-shadow:0 1px 3px rgba(0,0,0,.25)}
    select{height:31px;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--blue2);font-weight:800;padding:0 6px;font-size:11px}.actions{display:flex;gap:4px}.actions button{height:31px;width:44px;font-size:10.5px;padding:0}#allBtn{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 2px rgba(22,63,99,.18)}
    .logo-chip{height:36px;min-width:86px;width:86px;flex:0 0 86px;padding:4px 7px;background:#fff;border:3px solid var(--blue);border-radius:9px;overflow:visible;color:var(--blue);box-shadow:0 1px 3px rgba(15,45,73,.12);position:relative;display:inline-flex;align-items:center;justify-content:center}.logo-chip img{display:block;width:70px;height:25px;max-width:70px;max-height:25px;object-fit:contain;background:#fff;border-radius:4px}.logo-chip.selected{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 2px rgba(22,63,99,.20)}.logo-chip.selected img{background:#fff;padding:2px;border-radius:5px}.logo-chip .badge{position:absolute;right:1px;bottom:0;min-width:14px;height:14px;border-radius:999px;background:var(--gold);color:var(--blue2);font-size:9px;line-height:14px;font-weight:900;text-align:center;border:1px solid #fff}.logo-chip.fallback,.logo-chip.no-logo{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:900;font-size:11px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:9px}.card{height:62px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden}.card small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}.card strong{font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:5px}.card .pct{font-size:14px;font-weight:800;margin-left:7px}.neg{color:var(--red)!important}
    .table-panel{padding:9px;margin-bottom:12px}.table-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:7px}.table-head h2{font-size:16px;margin:0;color:var(--blue2)}.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px;background:#fff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:calc(100vh - 235px);min-height:350px}
    table{border-collapse:separate;border-spacing:0;width:100%;min-width:1040px;font-size:13px}th{background:var(--blue);color:#fff;position:sticky;top:0;z-index:3;text-align:center;font-weight:900}th,td{padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}th.desc,td.desc{position:sticky;left:0;z-index:20;min-width:270px;max-width:360px;text-align:left;background:#fff;box-shadow:6px 0 0 rgba(15,45,73,.10),1px 0 0 #111;border-right:2px solid #111;overflow:hidden;text-overflow:ellipsis}th.desc{z-index:60;background:var(--blue);color:#fff}thead tr:nth-child(2) th{top:34px}.company-head{border-left:3px solid #111!important}.period-head{font-size:11px}.sep-left{border-left:3px solid #111!important}tr.lvl1 td{background:var(--green2);font-weight:900}tr.lvl2 td{background:var(--yellow);font-weight:850}td.num{text-align:right;font-variant-numeric:tabular-nums}tr.lvl1 td.desc{background:var(--green2)}tr.lvl2 td.desc{background:var(--yellow)}.total-col{background:#faf8ef!important;font-weight:850}.zero{color:#98a2ad}
    .sheet-table{border-collapse:collapse;min-width:max-content;font-size:12px}.sheet-table td{min-width:92px;height:24px;padding:4px 7px;border:1px solid #c9d6c2;white-space:nowrap;font-variant-numeric:tabular-nums}.sheet-table .empty{background:#fff}.sheet-table .num{text-align:right}.sheet-note{font-size:12px;color:var(--muted);margin:0 0 8px}.download-link{color:var(--blue);font-weight:900;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff}
    .report-PISCOFINS table{min-width:max-content!important;font-size:10.5px!important}.report-PISCOFINS th,.report-PISCOFINS td{padding:5px 6px!important;text-align:center!important;vertical-align:middle!important}.report-PISCOFINS td.num{font-weight:400!important}.report-PISCOFINS th.desc,.report-PISCOFINS td.desc{min-width:155px!important;max-width:178px!important;text-align:left!important}.report-PISCOFINS .company-head{min-width:82px!important;height:34px!important;line-height:1.15!important;white-space:normal!important;background:var(--blue)!important;color:#fff!important}.report-PISCOFINS .period-head{height:28px!important;line-height:1.1!important;font-size:10px!important;min-width:64px!important;background:#d8ead1!important;color:var(--blue2)!important;font-weight:900!important}.report-PISCOFINS tr.lvl1 td{background:#d8ead1!important}.report-PISCOFINS tr.lvl2 td{background:#eef6ea!important}.report-PISCOFINS .table-wrap{max-height:calc(100vh - 210px)}
    .toolbar .field label,.toolbar .selector-title{text-align:center}.report-buttons button{line-height:1.05}.report-buttons #btn-PISCOFINS{font-size:10px;white-space:normal;padding:0 4px}
    .report-U006 .sheet-table{font-size:11px}.report-U006 .sheet-table td{min-width:72px;padding:4px 6px;font-weight:400!important}.report-U006 .sheet-table td:nth-child(1){min-width:42px!important;max-width:42px!important;width:42px!important}.report-U006 .sheet-table td:nth-child(2){min-width:250px!important;max-width:265px!important;width:250px!important;white-space:normal!important}.report-U006 .sheet-table tr:nth-child(4) td,.report-U006 .sheet-table tr:nth-child(5) td,.report-U006 .sheet-table tr:nth-child(6) td{text-align:center!important;font-weight:800!important}.report-U006 .sheet-table tr:nth-child(7) td:nth-child(2),.report-U006 .sheet-table tr:nth-child(8) td:nth-child(2),.report-U006 .sheet-table tr:nth-child(9) td:nth-child(2),.report-U006 .sheet-table tr:nth-child(10) td:nth-child(2){font-weight:700!important}.report-DISTRIB .sheet-table{font-size:11px}.report-DISTRIB .sheet-table td{min-width:74px;padding:3px 5px}
    .auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f2d49,#173f63);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px}.auth-card{width:min(420px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 22px 70px rgba(0,0,0,.28)}.auth-card h2{margin:0 0 8px;color:#0f2d49}.auth-card p{margin:0 0 18px;color:#65727f;line-height:1.45}.auth-card input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px}.auth-card button{width:100%;height:42px;margin-top:12px}.error{min-height:20px;color:var(--red);font-size:13px;margin-top:10px}.locked main,.locked header{filter:blur(8px);pointer-events:none;user-select:none}.hidden{display:none!important}
    @media(max-width:1250px){.toolbar{grid-template-columns:1fr 1fr}.company-field{grid-column:1/-1}.actions{grid-column:1/-1}.table-wrap{max-height:none}.report-buttons{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body class="locked">
  <div class="auth-screen" id="authScreen"><div class="auth-card"><h2>Acesso restrito</h2><p>Digite a senha para visualizar o dashboard.</p><input id="passwordInput" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter') unlock()"><button type="button" onclick="unlock()">Entrar</button><div class="error" id="passwordError"></div><p style="font-size:12px;margin-top:14px">Senha: ABX2026</p></div></div>
  <header class="hero"><h1>ABX / Água Branca — Dashboard RI Estático</h1><p>BP, DRU, Receita Gerencial U006, PIS/COFINS e Distribuição de Resultado. Layouts preservam os modelos atuais.</p></header>
  <main class="wrap">
    <section class="panel toolbar">
      <div class="field"><label>Relatório</label><div class="report-buttons"><button id="btn-BP" type="button" onclick="setReport('BP')">BP</button><button class="disabled" type="button" title="DRE será tratado depois">DRE</button><button id="btn-DRU" type="button" onclick="setReport('DRU')">DRU</button><button id="btn-U006" type="button" onclick="setReport('U006')">Campo<br>Grande</button><button id="btn-PISCOFINS" type="button" onclick="setReport('PISCOFINS')">PIS/<br>COFINS</button><button id="btn-RESUMO" type="button" onclick="setReport('RESUMO')">Resumo</button><button id="btn-DISTRIB" type="button" onclick="setReport('DISTRIB')">Lucros</button></div></div>
      <div class="field matrix-only"><label>Períodos</label><div class="periods" id="periodSelectors"></div></div>
      <div class="field matrix-only"><label>Visualização</label><select id="modeSelect" onchange="setViewMode(this.value)"><option value="sideTotal">+ Total</option><option value="side">Só blocos</option><option value="total">Só total</option><option value="summary">Sintético</option></select></div>
      <div class="field company-field matrix-only"><span class="selector-title" id="selectorTitle">Empresas</span><div class="companies" id="companySelectors"></div></div>
      <div class="actions matrix-only"><button id="allBtn" type="button" onclick="setAll(true)">ABX</button><button type="button" onclick="setAll(false)">Limpar</button></div>
    </section>
    <section class="cards" id="cards"></section>
    <div id="tables"><section class="panel table-panel">Carregando...</section></div>
  </main>
<script>
let DATA=null, reportType='BP', viewMode='sideTotal', selected=new Set(), selectedPeriods=new Set();
const fmt=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const LOGOS={};
function norm(s){return String(s||'').trim().replace(/[–—]/g,'-').toUpperCase()}
function unlock(){const input=document.getElementById('passwordInput'),err=document.getElementById('passwordError');if(['ABX2026','ABX-96VSFQGT5J_M'].includes(norm(input.value))){try{sessionStorage.setItem('abx_ri_auth','ok')}catch(e){}document.body.classList.remove('locked');document.getElementById('authScreen').style.display='none';input.value='';render()}else{err.textContent='Senha inválida. Use ABX2026';input.select()}}
function initAuth(){try{if(sessionStorage.getItem('abx_ri_auth')==='ok'){document.body.classList.remove('locked');document.getElementById('authScreen').style.display='none'}}catch(e){}}
function rep(){return DATA.reports[reportType]}function isSheet(){return rep().type==='sheet'}function isControl(){return rep().type==='unit_period_control'}
function selectableCompanies(){return isSheet()?[]:rep().companies.filter(c=>!String(c.name).startsWith('TOTAL'))}function effectiveCompanies(){const base=selectableCompanies();const arr=base.filter(c=>selected.has(c.name));return arr.length?arr:base}function activePeriods(){const arr=rep().periods.filter(p=>selectedPeriods.has(p));return arr.length?arr:rep().periods}
function money(v){if(!v)return '<span class="zero">–</span>';return fmt.format(v)}function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function rowTotal(row,p){return effectiveCompanies().reduce((s,c)=>s+(row.empresas[c.name]?.[p]||0),0)}
function initSelection(){if(isSheet()){selected=new Set();selectedPeriods=new Set();return}selected=new Set(selectableCompanies().map(c=>c.name));selectedPeriods=new Set(rep().periods)}
function setReport(r){reportType=r;initSelection();renderSelectors();render()}function togglePeriodIndex(i){const p=rep().periods[i];if(selectedPeriods.has(p)&&selectedPeriods.size>1)selectedPeriods.delete(p);else selectedPeriods.add(p);renderSelectors();render()}function toggleCompanyIndex(i){const c=selectableCompanies()[i];if(!c)return;if(selected.has(c.name)&&selected.size>1)selected.delete(c.name);else selected.add(c.name);renderSelectors();render()}function setAll(on){const base=selectableCompanies();selected=on?new Set(base.map(c=>c.name)):new Set([base[0]?.name].filter(Boolean));renderSelectors();render()}function setViewMode(v){viewMode=v;render()}function displayHeader(c){return reportType==='DRU'?String(c.name).replace(/^\d+\s*-\s*/,''):c.name}
function renderSelectors(){['BP','DRU','U006','PISCOFINS','RESUMO','DISTRIB'].forEach(k=>{const b=document.getElementById('btn-'+k);if(b)b.classList.toggle('active',reportType===k)});document.querySelectorAll('.matrix-only').forEach(el=>el.classList.toggle('hidden',isSheet()));if(isSheet())return;document.getElementById('modeSelect').value=viewMode;document.getElementById('selectorTitle').textContent=reportType==='BP'?'Empresas':(reportType==='PISCOFINS'?'Unidades PIS/COFINS':'Unidades DRU');const allBtn=document.getElementById('allBtn');if(allBtn)allBtn.textContent=reportType==='BP'?'ABX':'Todas';document.getElementById('periodSelectors').innerHTML=rep().periods.map((p,i)=>'<button type="button" class="chip '+(selectedPeriods.has(p)?'selected':'')+'" onclick="togglePeriodIndex('+i+')">'+esc(p)+'</button>').join('');document.getElementById('companySelectors').innerHTML=selectableCompanies().map((c,i)=>{if(reportType==='BP'){const img=c.logo_asset?'<img src="'+esc(c.logo_asset)+'" alt="'+esc(c.name)+'">':esc(c.code||c.name);const badge=c.badge?'<span class="badge">'+esc(c.badge)+'</span>':'';return '<button type="button" class="logo-chip '+(c.logo_asset?'':'fallback')+' '+(selected.has(c.name)?'selected':'')+'" title="'+esc(c.name)+'" onclick="toggleCompanyIndex('+i+')">'+img+badge+'</button>'}const label=c.code||c.name.split(' - ')[0];return '<button type="button" class="chip dru-chip '+(selected.has(c.name)?'selected':'')+'" title="'+esc(c.name)+'" onclick="toggleCompanyIndex('+i+')">'+esc(label)+'</button>'}).join('')}
function findRow(label){return rep().rows.find(r=>String(r.descricao).toUpperCase()===label)}function total(label,p){const row=findRow(label);return row?rowTotal(row,p):0}function pct(v,p){const rl=total('RECEITA LIQUIDA',p);return rl?((v/rl)*100).toFixed(1).replace('.',',')+'%':'–'}
function renderCards(){if(isSheet()||isControl()){document.getElementById('cards').innerHTML='';return}const p=activePeriods()[activePeriods().length-1];let cards=[];if(reportType==='BP'){cards=[['ATIVO',total('ATIVO',p)],['PASSIVO TOTAL',total('PASSIVO TOTAL',p)],['PATRIMÔNIO LÍQUIDO',total('PATRIMÔNIO LÍQUIDO',p)],['Disponibilidade',total('DISPONIBILIDADE',p)]]}else{const cmv=total('CMV',p),desp=total('DESPESA OPERACIONAIS',p),ebitda=total('EBITDA',p),lucro=total('LUCRO LIQUIDO',p);cards=[['RECEITA LÍQUIDA',total('RECEITA LIQUIDA',p),null],['CMV',cmv,pct(cmv,p)],['DESP. OPERACIONAL',desp,pct(desp,p)],['EBITDA',ebitda,pct(ebitda,p)],['LUCRO LÍQUIDO',lucro,pct(lucro,p)]]}document.getElementById('cards').innerHTML=cards.map(c=>'<article class="card"><small>'+esc(c[0])+' em '+esc(p)+'</small><strong class="'+(c[1]<0?'neg':'')+'">'+money(c[1])+(c[2]?' <span class="pct">'+esc(c[2])+'</span>':'')+'</strong></article>').join('')}
function cell(v,extra,total){return '<td class="num '+(extra||'')+' '+(total?'total-col':'')+' '+(v<0?'neg':'')+'">'+money(v)+'</td>'}function shouldShowRow(r){if(viewMode!=='summary')return true;const nivel=Number(r.nivel),d=String(r.descricao||'').toUpperCase();if(reportType==='BP')return nivel<=2||['DISPONIBILIDADE','ESTOQUES','CRÉDITOS A RECEBER','RECEBÍVEIS ANTECIPADOS','ADIANTAMENTOS','FORNECEDORES','ALUGUÉIS','SALÁRIOS E CONTRIBUIÇÕES','IMPOSTOS A PAGAR','EMPRÉSTIMOS E FINANCIAMENTOS','CRÉDITOS ROTATIVOS','CAPITAL SOCIAL','RETIRADAS / PARTICIPAÇÕES','RESULTADOS ACUMULADOS'].includes(d);return nivel<=2||['RECEITA LIQUIDA','CMV','DESPESA OPERACIONAIS','EBITDA','LUCRO LIQUIDO','LUCRO LÍQUIDO GERENCIAL','LAIR GERENCIAL','NOVO LUCRO LÍQUIDO'].includes(d)}
function renderMatrix(){const comps=effectiveCompanies(),ps=activePeriods(),rows=rep().rows.filter(shouldShowRow),synthetic=viewMode==='summary',tableMode=synthetic?'sideTotal':viewMode;let out='<section class="panel table-panel report-'+reportType+'"><div class="table-head"><h2>'+esc(rep().label)+' — '+(synthetic?'visualização sintética':(tableMode==='total'?'Total':(ps.length>1?'períodos por bloco':'período por bloco')))+'</h2><span class="pill">'+comps.length+' selecionada(s)'+(synthetic?' · sintético':'')+'</span></div><div class="table-wrap"><table>';if(tableMode==='total'){out+='<thead><tr><th class="desc">Descrição</th>'+ps.map((p,i)=>'<th class="period-head '+(i===0?'sep-left':'')+'">'+esc(p)+'</th>').join('')+'</tr></thead><tbody>';rows.forEach(r=>{out+='<tr class="lvl'+Math.floor(Number(r.nivel))+'"><td class="desc" title="'+esc(r.descricao)+'">'+esc(r.descricao)+'</td>'+ps.map((p,i)=>cell(rowTotal(r,p),i===0?'sep-left':'',true)).join('')+'</tr>'})}else{out+='<thead><tr><th class="desc" rowspan="2">Descrição</th>'+comps.map((c,i)=>'<th class="company-head '+(i===0?'sep-left':'')+'" colspan="'+ps.length+'">'+esc(displayHeader(c))+'</th>').join('')+(tableMode==='sideTotal'?'<th class="company-head sep-left" colspan="'+ps.length+'">TOTAL</th>':'')+'</tr><tr>'+comps.map(c=>ps.map((p,i)=>'<th class="period-head '+(i===0?'sep-left':'')+'">'+esc(p)+'</th>').join('')).join('')+(tableMode==='sideTotal'?ps.map(p=>'<th class="period-head sep-left">'+esc(p)+'</th>').join(''):'')+'</tr></thead><tbody>';rows.forEach(r=>{out+='<tr class="lvl'+Math.floor(Number(r.nivel))+'"><td class="desc" title="'+esc(r.descricao)+'">'+esc(r.descricao)+'</td>'+comps.map(c=>ps.map((p,i)=>cell(r.empresas[c.name]?.[p]||0,i===0?'sep-left':'',false)).join('')).join('')+(tableMode==='sideTotal'?ps.map(p=>cell(rowTotal(r,p),'sep-left',true)).join(''):'')+'</tr>'})}out+='</tbody></table></div></section>';document.getElementById('tables').innerHTML=out}
function fmtCell(v){if(typeof v==='number')return fmt.format(v);return esc(v)}function renderSheet(){let out='<section class="panel table-panel report-'+reportType+'"><div class="table-head"><h2>'+esc(rep().label)+'</h2><span class="pill">layout Excel preservado</span></div><p class="sheet-note">Modelo operacional mantido para preservar formato, cores e totalizadores atuais.</p><div class="table-wrap"><table class="sheet-table"><tbody>';rep().rows.forEach(row=>{out+='<tr>'+row.map(cell=>{let style='';if(cell.style?.bg)style+='background:'+cell.style.bg+';';if(cell.style?.color)style+='color:'+cell.style.color+';';if(cell.style?.bold)style+='font-weight:900;';const cls=(typeof cell.v==='number')?'num':'';return '<td class="'+cls+'" colspan="'+(cell.cs||1)+'" rowspan="'+(cell.rs||1)+'" style="'+style+'">'+fmtCell(cell.v)+'</td>'}).join('')+'</tr>'});out+='</tbody></table></div></section>';document.getElementById('tables').innerHTML=out}
function render(){if(!DATA)return;renderCards();isSheet()?renderSheet():renderMatrix()}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;initSelection();renderSelectors();render();initAuth()}).catch(e=>{document.getElementById('tables').innerHTML='<section class="panel table-panel">Erro ao carregar data.json: '+esc(e.message)+'</section>';initAuth()});
</script>
</body>
</html>
